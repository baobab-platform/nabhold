# BA-SEC-DEP-001 — Approved Baobab Dependency & Security Maintenance Policy v1.0.
# Advisory-driven security updates are not constrained by the weekly version schedule.
# Keep the default branch implicit (target-branch disables security-update routing).
# Routine grouping excludes majors and does not coalesce security updates.
# Review pinned Actions, npm/pnpm, private Baobab Experience packages and
# image digests independently before qualifying any protected deployment.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Runtime declarations and current container image target Node 24. Newer
    # typings majors can expose APIs unavailable to the deployed runtime.
    # Retain the version-update-only major guard until a reviewed DEV-10
    # Node runtime migration; this does not ignore security advisories.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
