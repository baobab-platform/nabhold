# Temporary, SHA256-pinned transfer of manually inspected browser evidence.
# This workflow self-deletes together with the reviewed map baseline commit.
name: Transfer reviewed Nabhold map visual baselines
on:
  push:
    branches: [fix/bxs-map-keyboard-conformance]
    paths: [.github/workflows/bxs-audited-baseline-capture.yml]
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    if: ${{ github.repository == 'baobab-platform/nabhold' && github.ref == 'refs/heads/fix/bxs-map-keyboard-conformance' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify and commit browser-captured map golden references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          gh run download 39050713226 --repo baobab-platform/nabhold --name nabhold-map-browser-evidence --dir "$temp"
          root="tests/e2e/africa-footprint.spec.ts-snapshots"
          mkdir -p "$root"
          for width in 390 1440; do
            file="africa-footprint-${width}-chromium-linux.png"
            test -s "$temp/$root/$file"
            cp "$temp/$root/$file" "$root/$file"
          done
          echo "cdd93dafbf1673a0ee880614191ce799e921e2f4618bb7c25b7495dcdc7ceff4  $root/africa-footprint-390-chromium-linux.png" | sha256sum -c -
          echo "67553498f0d86c50adee37781f50d32917b54f476e0512ca01c47768d5399058  $root/africa-footprint-1440-chromium-linux.png" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$root/africa-footprint-390-chromium-linux.png" "$root/africa-footprint-1440-chromium-linux.png"
          git rm -- .github/workflows/bxs-audited-baseline-capture.yml
          git commit -m "test(bxs): pin reviewed narrow and wide Africa map visual baselines"
          git push origin HEAD:refs/heads/fix/bxs-map-keyboard-conformance
