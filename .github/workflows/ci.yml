name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e
      options: --user 0
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match baobab-dev Node 24 runtime baseline
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install locked packages with read-only GitHub registry permission
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Install TLS fixture build headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libssl-dev

      - name: Build pinned TLS Redis fixture
        shell: bash
        run: |
          scripts/build-test-redis.sh "$RUNNER_TEMP/nabhold-test-redis" > "$RUNNER_TEMP/nabhold-redis-build.log" 2>&1 || {
            tail -60 "$RUNNER_TEMP/nabhold-redis-build.log"
            exit 1
          }

      - name: Confidential BFF store — real TLS Redis acceptance
        env:
          NABHOLD_TEST_REDIS_BINARY: ${{ runner.temp }}/nabhold-test-redis/src/redis-server
        run: pnpm test:auth-store

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NABHOLD_DASHBOARD_PREVIEW: "false"
          NABHOLD_CONTENT_DEV_FALLBACK: "false"
        run: pnpm build

      - name: Resolve baobab-dev Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(find /root/.cache/ms-playwright -type f \
            \( -name headless_shell -o -name chrome \) -print -quit)"
          test -n "$browser"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"

      - name: End-to-end tests
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: pnpm test:e2e

  action-pinning:
    name: Enforce action pinning
    uses: baobab-platform/shared/.github/workflows/enforce-action-pinning.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    permissions:
      contents: read

  dependabot-policy:
    name: Enforce Dependabot policy
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    permissions:
      contents: read
    with:
      required-ecosystems: "github-actions,npm"
