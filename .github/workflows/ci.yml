name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespaces-contract:
    name: Codespaces lifecycle and registry contract (no private image)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # Run before pulling an organisation GHCR job image. This job remains
      # diagnostic even if baobab-dev's separate Actions access is missing.
      - name: Check out reviewed configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install public pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Verify private package and prebuild-safe Codespaces contract
        run: node --test scripts/codespaces/*.node.mjs

  ghcr-access:
    name: GHCR read-only immutable image preflight
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      # This job uses a public runner and does not require the private image
      # to START. If it fails 403, grant Nabhold *Actions* access on the
      # org's baobab-dev package; Codespaces access is a different ACL.
      - name: Authenticate to GHCR using only repository package-read authority
        env:
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Check exact published frontend and browser image digests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect 'ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend@sha256:1b3165067912eacbca96b576efb67e0428850b1ff1a953aa9013127a01635371' >/dev/null
          docker buildx imagetools inspect 'ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213' >/dev/null
          echo "GHCR_READ_VERIFIED (Actions only; Codespaces ACL separately required)"

  quality:
    name: Quality gates
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Match baobab-dev Node 24 runtime baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          registry-url: "https://npm.pkg.github.com"
          scope: "@baobab-platform"

      - name: Verify Codespaces lifecycle, org package grants and token-free bootstrap
        run: node --test scripts/codespaces/*.node.mjs

      - name: Verify sanitized integration evidence and incomplete-run denial
        run: node --experimental-strip-types --test scripts/integration/evidence.node.mjs

      - name: Install locked packages with read-only GitHub registry permission
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Install synchronized Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Preserve earlier gate originals after an unscoped Playwright invocation
        run: node scripts/dev11-report-custody.node.mjs

      # The governed container runs as root; GitHub mounts /github/home with
      # runner ownership. Firefox refuses startup if HOME is not owned by root.
      - name: Prepare Firefox home ownership
        run: chown 0:0 /github/home

      - name: Qualify all three real browser engines
        run: node scripts/verify-playwright-browsers.mjs

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Install TLS fixture build headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libssl-dev

      - name: Build pinned TLS Redis fixture
        shell: bash
        run: |
          scripts/build-test-redis.sh "$RUNNER_TEMP/nabhold-test-redis" > "$RUNNER_TEMP/nabhold-redis-build.log" 2>&1 || {
            tail -60 "$RUNNER_TEMP/nabhold-redis-build.log"
            exit 1
          }

      - name: Confidential BFF store — real TLS Redis acceptance
        env:
          NABHOLD_TEST_REDIS_BINARY: ${{ runner.temp }}/nabhold-test-redis/src/redis-server
        run: pnpm test:auth-store

      - name: Unit tests
        run: pnpm test

      - name: Build
        id: production_build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NABHOLD_DASHBOARD_PREVIEW: "false"
          # Build genuine public production mode with CMS fallback firmly OFF.
          NABHOLD_CONTENT_DEV_FALLBACK: "false"
        run: pnpm build

      - name: Measure frontend static-asset budgets
        id: static_budget
        # Continue collecting the other independent browser evidence, but the
        # final gate below makes any limit breach a hard CI failure.
        continue-on-error: true
        run: pnpm perf:budget

      - name: Public functional end-to-end journeys (five browser profiles)
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        id: experience_browser
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: functional
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: pnpm test:e2e

      # Each experience gate continues after another suite fails, provided the
      # production build succeeded; earlier failures remain mandatory and no
      # suite or negative case is skipped merely because a sibling failed.
      # Lighthouse is CPU-sensitive. Do not run it alongside Playwright workers;
      # the independent gate preserves its own evidence and numerical thresholds.
      - name: Isolated production-build Lighthouse lab
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: lighthouse
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: pnpm test:e2e:lighthouse

      - name: WCAG 2.2 AA public accessibility gate
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: accessibility
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: pnpm test:e2e:a11y

      - name: Landing-page visual and layout gate
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        id: experience_visual
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: visual
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: pnpm test:e2e:visual

      # Public preview-only journey is a separate, disposable development lab.
      # No fixture data is ever accepted as published CMS content.
      - name: Explicit dev-fixture portfolio journey (non-production evidence)
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: pnpm test:e2e:preview

      - name: Enforce approved static budgets after all browser diagnostics
        if: always()
        env:
          BUDGET_OUTCOME: ${{ steps.static_budget.outcome }}
        run: |
          if [ "$BUDGET_OUTCOME" != "success" ]; then
            echo "Static asset budget remains a mandatory merge-blocking failure"
            exit 1
          fi

      - name: Preserve Playwright, map baselines, visual, accessibility and Lighthouse receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nabhold-experience-browser-evidence
          if-no-files-found: error
          path: |
            tests/e2e/africa-footprint.spec.ts-snapshots/
            test-results/
            playwright-report/
            reports/static-budget.json
            reports/dev11-*-playwright.json

  action-pinning:
    name: Enforce action pinning
    uses: baobab-platform/shared/.github/workflows/enforce-action-pinning.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    permissions:
      contents: read

  dependabot-policy:
    name: Enforce Dependabot policy
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # v2.3.0
    permissions:
      contents: read
    with:
      required-ecosystems: "github-actions,npm"
