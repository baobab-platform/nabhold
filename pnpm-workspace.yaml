overrides:
  postcss: 8.5.26
  sharp: 0.35.5
  source-map-js: 1.2.2
  # GHSA-587h-7wmj-h5pm: patch the currently locked Vite 7 dependency line
  # while retaining the supported major and direct Vitest 5.
  "vite@>=7.0.0 <8": 7.3.7
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Immutable, publisher-verified Experience registry releases only.
# Fixed-version exceptions are allowed only after independently verified
# GitHub Packages SHA512/export run 39073362603 (2026-10-17).
minimumReleaseAgeExclude:
  - "@baobab-platform/experience-geo-core@0.3.1"
  - "@baobab-platform/experience-tokens@0.3.1"
